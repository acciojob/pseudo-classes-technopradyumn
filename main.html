<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Pseudo Classes</title>
<style>
  /* Page background */
  :root {
    background-color: rgb(135, 206, 235);
  }
  body { font-family: Arial, sans-serif; margin: 0; padding: 20px; color: #000; }

  /* Article paragraphs */
  article p:first-child { color: white; background-color: black; }
  article p:nth-child(2) { color: inherit; }
  article p:last-child { color: red; }

  /* List */
  ul { list-style: none; margin: 0; padding: 0; }
  li { background-color: gray; width: 50%; padding: 10px; }
  li:nth-child(odd) { background-color: white; }
  li:first-child, li:last-child { font-size: 22px; }
  li:nth-last-child(3) { background-color: pink; } /* after the odd rule so it wins */
</style>
</head>
<body>
  <h1>CSS Pseudo Classes</h1>

  <article>
    <p>This is the first paragraph: white text on a black background.</p>
    <p>This is the second paragraph: standard text color.</p>
    <p>This is the third paragraph: red text.</p>
  </article>

  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
    <li>Item 4</li>
    <li>Item 5</li>
  </ul>
</body>
</html>
